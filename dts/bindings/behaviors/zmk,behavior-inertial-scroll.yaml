# SPDX-License-Identifier: MIT
description: LiNEA40 encoder-only inertial scrolling impulse

compatible: "zmk,behavior-inertial-scroll"

properties:
  "#binding-cells":
    type: int
    required: true
    const: 1
  frame-ms:
    type: int
    default: 16
  tail-frames:
    type: int
    default: 11
  rapid-threshold-ms:
    type: int
    default: 90
  grouping-threshold-ms:
    type: int
    default: 155
  rapid-impulse-q8:
    type: int
    default: 120
  grouped-impulse-q8:
    type: int
    default: 65
  velocity-cap-q8:
    type: int
    default: 400
  decay-percent:
    type: int
    default: 76
  slow-detent-ticks:
    type: int
    default: 2
  rapid-detent-ticks:
    type: int
    default: 1
  hires-detent-units:
    type: int
    default: 16
  hires-immediate-units:
    type: int
    default: 6
  hires-chunk-units:
    type: int
    default: 5

binding-cells:
  - direction
